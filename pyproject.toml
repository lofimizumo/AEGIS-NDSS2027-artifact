[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
dynamic = ["version"]
description = "Research framework for privacy-preserving language-model training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate",
    "datasets==2.21.0",
    "huggingface-hub>=0.23.2,<1",
    "nltk",
    "numpy>=1.22.4,<2",
    "peft",
    "pillow",
    "rouge-score",
    "safetensors",
    "scikit-learn",
    "scipy",
    "tokenizers>=0.20,<0.21",
    "torch",
    "tqdm",
    "transformers==4.46.3",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "aegis.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.11"
files = ["src/aegis"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: exercises local model training and package integration",
]
